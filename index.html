<!doctype html>
<html lang="en" data-theme="night" data-density="comfortable" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumen · Modrinth Explorer</title>
<meta name="description" content="Browse, search, filter and save Modrinth mods with a fast, themeable interface.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236ee7b7'/%3E%3Cstop offset='1' stop-color='%23818cf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M10 9v11.5h10' fill='none' stroke='%230b0d12' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --radius:18px;--radius-sm:12px;--ease:cubic-bezier(.2,.8,.2,1);
  --accent:#818cf8;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme=night]{--bg:#0b0d12;--bg2:#10131a;--surface:#161a23;--surface2:#1d2230;--border:#262c3b;--text:#e8ebf3;--muted:#8a93a8;--shadow:0 12px 40px rgba(0,0,0,.45)}
[data-theme=aurora]{--bg:#061619;--bg2:#0a1f23;--surface:#0f2a2f;--surface2:#143640;--border:#1f4850;--text:#e6fbf8;--muted:#8fb9b5;--shadow:0 12px 40px rgba(0,0,0,.4)}
[data-theme=ember]{--bg:#130b09;--bg2:#1a100d;--surface:#22160f;--surface2:#2c1d15;--border:#40291e;--text:#fbeee8;--muted:#b59a8e;--shadow:0 12px 40px rgba(0,0,0,.45)}
[data-theme=paper]{--bg:#f5f4f0;--bg2:#fbfaf7;--surface:#ffffff;--surface2:#f1efe9;--border:#e2dfd6;--text:#1c1b19;--muted:#6f6b62;--shadow:0 12px 32px rgba(60,50,30,.12)}
[data-theme=mint]{--bg:#eef8f3;--bg2:#f7fcf9;--surface:#ffffff;--surface2:#e6f4ec;--border:#cfe6da;--text:#10231b;--muted:#557064;--shadow:0 12px 32px rgba(16,60,40,.10)}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);color:var(--text);
  background:
    radial-gradient(900px 500px at 8% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),
    radial-gradient(800px 500px at 110% 10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  transition:background-color .4s var(--ease),color .4s var(--ease);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
svg.ic{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ambient orbs */
.orb{position:fixed;width:38vmax;height:38vmax;border-radius:50%;filter:blur(90px);opacity:.14;pointer-events:none;z-index:0;background:var(--accent)}
.orb.a{top:-18vmax;left:-12vmax;animation:drift 22s ease-in-out infinite alternate}
.orb.b{bottom:-22vmax;right:-14vmax;animation:drift 28s ease-in-out infinite alternate-reverse;opacity:.1}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vw,4vh) scale(1.12)}}

/* top bar */
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:12px clamp(14px,3vw,28px);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#6ee7b7,var(--accent));box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .5s var(--ease)}
.brand:hover .logo{transform:rotate(-12deg) scale(1.06)}
.logo svg{width:18px;height:18px;color:#0b0d12}
.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;position:relative}
.tab{position:relative;z-index:1;border:0;background:none;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;transition:color .25s}
.tab[aria-selected=true]{color:var(--text)}
.tab-pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15);transition:transform .45s var(--ease)}
.tabs[data-active=saved] .tab-pill{transform:translateX(100%)}
.search{flex:1;max-width:560px;position:relative;margin-left:auto}
.search input{
  width:100%;height:42px;padding:0 44px 0 42px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);outline:none;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.search .ic{position:absolute;left:14px;top:12px;color:var(--muted);pointer-events:none}
.kbd{position:absolute;right:12px;top:11px;font:600 11px var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:3px 6px;background:var(--bg2)}
.icon-btn{
  width:42px;height:42px;display:grid;place-items:center;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  transition:transform .2s var(--ease),border-color .2s,color .2s,background .2s;position:relative;flex:none;
}
.icon-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.on{color:#fb7185;border-color:color-mix(in srgb,#fb7185 50%,var(--border))}
.icon-btn.on svg{fill:currentColor}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#0b0d12;font-size:11px;font-weight:800;display:grid;place-items:center;transform:scale(0);transition:transform .35s var(--ease)}
.badge.show{transform:scale(1)}

/* layout */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:270px 1fr;gap:24px;padding:24px clamp(14px,3vw,28px) 60px;max-width:1500px;margin:0 auto}
.filters{position:sticky;top:86px;align-self:start;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(10px);max-height:calc(100vh - 110px);overflow:auto}
.filters h4{margin:18px 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.filters h4:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--border);background:var(--bg2);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--muted);
  transition:all .25s var(--ease);
}
.chip:hover{color:var(--text);transform:translateY(-1px)}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--text)}
select.field{
  width:100%;height:40px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2);padding:0 10px;outline:none;
}
select.field:focus{border-color:var(--accent)}
.ghost{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0;margin-top:14px}
.ghost:hover{text-decoration:underline}

.hero{margin:0 0 18px;animation:rise .7s var(--ease) both}
.hero h1{margin:0;font-size:clamp(26px,3.6vw,38px);letter-spacing:-.03em;line-height:1.1}
.hero p{margin:8px 0 0;color:var(--muted)}
.grad{background:linear-gradient(90deg,var(--accent),#6ee7b7,var(--accent));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s linear infinite}
@keyframes sheen{to{background-position:200% 0}}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.count{color:var(--muted);font-size:14px}
.count b{color:var(--text)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:12px;padding:3px;background:var(--surface);position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;width:36px;height:30px;border-radius:9px;color:var(--muted);display:grid;place-items:center;transition:color .2s}
.seg button[aria-pressed=true]{color:var(--text)}
.seg .slide{position:absolute;top:3px;bottom:3px;left:3px;width:36px;border-radius:9px;background:var(--surface2);transition:transform .4s var(--ease)}
.seg[data-v=list] .slide{transform:translateX(36px)}
.sortwrap{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.sortwrap select{width:auto;min-width:170px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
[data-density=compact] .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.grid.list{grid-template-columns:1fr;gap:10px}

.card{
  position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;cursor:pointer;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 1px 0 rgba(255,255,255,.02) inset;
  transition:transform .35s var(--ease),border-color .3s,box-shadow .35s var(--ease),background .3s;
  animation:rise .55s var(--ease) both;
}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 55%,var(--border));box-shadow:var(--shadow)}
.card:focus-visible{outline-offset:3px}
.card-top{display:flex;gap:12px;align-items:flex-start}
.card .save{margin-left:auto;width:34px;height:34px;border-radius:10px}
.card .save svg{width:16px;height:16px}
.meta{min-width:0;flex:1}
.meta h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.by{margin:2px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{margin:0;color:color-mix(in srgb,var(--text) 78%,var(--muted));font-size:13.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.stats{margin-top:auto;display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.stats span{display:inline-flex;align-items:center;gap:5px}
.stats svg{width:14px;height:14px}

.icon{
  width:52px;height:52px;border-radius:14px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,var(--surface2)),var(--surface2));
  font-weight:800;color:var(--text);font-size:20px;
  transition:transform .4s var(--ease);
}
.card:hover .icon{transform:scale(1.06) rotate(-2deg)}
.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.icon.lg{width:84px;height:84px;border-radius:20px;font-size:30px}
.icon.sm{width:40px;height:40px;border-radius:12px;font-size:15px}

.grid.list .card{flex-direction:row;align-items:center}
.grid.list .card-top{flex:1;min-width:0;align-items:center}
.grid.list .desc{min-height:0;-webkit-line-clamp:1}
.grid.list .tags{display:none}
.grid.list .stats{margin-top:0;min-width:150px;justify-content:flex-end}

.skel{border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;position:relative}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--text) 6%,transparent),transparent);transform:translateX(-100%);animation:shimmer 1.4s infinite}
.sk{background:var(--surface2);border-radius:8px}
@keyframes shimmer{to{transform:translateX(100%)}}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);animation:rise .5s var(--ease) both}
.empty .ic{width:44px;height:44px;margin:0 auto 12px;color:var(--accent);opacity:.8}
.empty h3{color:var(--text);margin:0 0 6px}

.more{display:flex;justify-content:center;margin:26px 0 0}
.btn{
  height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:600;
  display:inline-flex;align-items:center;gap:8px;transition:transform .2s var(--ease),border-color .2s,background .2s;
}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:#0b0d12}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:#fb7185}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#sentinel{height:1px}

/* drawer + overlay */
.overlay{position:fixed;inset:0;background:rgba(3,5,10,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:90}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:100;
  background:var(--bg2);border-left:1px solid var(--border);box-shadow:var(--shadow);
  transform:translateX(104%);transition:transform .5s var(--ease);display:flex;flex-direction:column;
}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.drawer-head strong{font-size:14px;color:var(--muted);font-weight:600}
.drawer-body{overflow:auto;padding:22px 22px 40px;flex:1}
.d-top{display:flex;gap:16px;align-items:center;animation:rise .5s var(--ease) both}
.d-top h2{margin:0;font-size:24px;letter-spacing:-.02em}
.d-top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.d-desc{margin:18px 0;font-size:15px;line-height:1.6;color:color-mix(in srgb,var(--text) 85%,var(--muted));animation:rise .6s var(--ease) .05s both}
.d-actions{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 4px;animation:rise .6s var(--ease) .1s both}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0;animation:rise .6s var(--ease) .12s both}
.d-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
.d-stat small{color:var(--muted);font-size:12px}
.d-stat div{font-size:18px;font-weight:750;margin-top:2px}
.section-title{margin:26px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gallery img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid var(--border);transition:transform .4s var(--ease)}
.gallery img:hover{transform:scale(1.03)}
.versions{display:flex;flex-direction:column;gap:8px}
.ver{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);animation:rise .45s var(--ease) both}
.ver .vn{font-weight:700;font-size:14px}
.ver .vm{color:var(--muted);font-size:12px;margin-top:2px}
.ver a.dl{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border:1px solid var(--border);padding:7px 10px;border-radius:10px;color:var(--text)}
.ver a.dl:hover{border-color:var(--accent);text-decoration:none}
.md{font-size:14.5px;line-height:1.7;color:color-mix(in srgb,var(--text) 88%,var(--muted));word-wrap:break-word}
.md h3,.md h4,.md h5{margin:20px 0 8px;color:var(--text)}
.md p{margin:10px 0}
.md ul{padding-left:20px}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:2px 5px;border-radius:6px}
.md-box{max-height:420px;overflow:auto;padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:13px;border:1px solid var(--border);border-radius:999px;padding:6px 11px;color:var(--text);display:inline-flex;gap:6px;align-items:center;background:var(--surface)}
.links a:hover{border-color:var(--accent);text-decoration:none}
.links svg{width:14px;height:14px}

/* modal */
.modal-wrap{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:16px;pointer-events:none;opacity:0;transition:opacity .3s var(--ease)}
.modal-wrap.open{pointer-events:auto;opacity:1}
.modal{
  width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);
  transform:translateY(16px) scale(.97);transition:transform .45s var(--ease);
}
.modal-wrap.open .modal{transform:none}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:2}
.modal-head h2{margin:0;font-size:18px}
.modal-body{padding:6px 22px 22px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.set-row h4{margin:0;font-size:14.5px}
.set-row p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%;margin-top:12px}
.theme-card{border:1px solid var(--border);border-radius:14px;padding:8px;background:var(--surface);text-align:left;transition:transform .25s var(--ease),border-color .2s}
.theme-card:hover{transform:translateY(-2px)}
.theme-card[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.theme-prev{height:56px;border-radius:9px;position:relative;overflow:hidden}
.theme-prev::after{content:"";position:absolute;left:8px;bottom:8px;width:34px;height:8px;border-radius:99px;background:var(--c)}
.theme-prev i{position:absolute;right:8px;top:8px;width:18px;height:18px;border-radius:6px;background:var(--c);opacity:.85}
.theme-card span{display:block;font-size:13px;font-weight:600;margin-top:7px}
.swatches{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c);transition:transform .2s var(--ease)}
.sw:hover{transform:scale(1.12)}
.sw[aria-pressed=true]{border-color:var(--text);box-shadow:0 0 0 3px var(--bg2),0 0 0 5px var(--c)}
.seg2{display:inline-flex;border:1px solid var(--border);border-radius:10px;padding:3px;background:var(--surface)}
.seg2 button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--muted);font-size:13px;font-weight:600;transition:all .25s}
.seg2 button[aria-pressed=true]{background:var(--surface2);color:var(--text)}
.switch{position:relative;width:46px;height:27px;flex:none;border-radius:99px;border:1px solid var(--border);background:var(--surface2);transition:background .3s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--text);transition:transform .35s var(--ease)}
.switch[aria-checked=true]{background:var(--accent);border-color:transparent}
.switch[aria-checked=true]::after{transform:translateX(19px);background:#0b0d12}

/* toast */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px) scale(.98);transition:all .35s var(--ease)}
.toast.in{opacity:1;transform:none}
.toast.error{border-color:#fb7185}
.toast.ok{border-color:#34d399}

.filter-toggle{display:none}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* motion off */
[data-motion=off] *,[data-motion=off] *::before,[data-motion=off] *::after{animation:none!important;transition:none!important}

/* responsive */
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .filters{position:static;max-height:none}
  .filter-toggle{display:inline-flex}
  .filters.collapsed{display:none}
}
@media (max-width:720px){
  .brand span.name{display:none}
  .topbar{flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none;margin:0}
  .kbd{display:none}
  .grid.list .stats{display:none}
  .grid.list .card{flex-direction:column;align-items:stretch}
  .sortwrap span{display:none}
}
</style>
</head>
<body>
<div class="orb a" aria-hidden="true"></div>
<div class="orb b" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5v12h12"/></svg></div>
    <span class="name">Lumen</span>
  </div>
  <nav class="tabs" id="tabs" data-active="explore" role="tablist">
    <span class="tab-pill" aria-hidden="true"></span>
    <button class="tab" role="tab" data-tab="explore" aria-selected="true">Explore</button>
    <button class="tab" role="tab" data-tab="saved" aria-selected="false">Saved <span id="savedCount"></span></button>
  </nav>
  <label class="search">
    <span id="searchIcon"></span>
    <input id="q" type="search" placeholder="Search mods, libraries, optimizations…" autocomplete="off" aria-label="Search mods">
    <span class="kbd">/</span>
  </label>
  <button class="icon-btn" id="openSettings" aria-label="Settings" title="Settings"><span id="settingsIcon"></span></button>
</header>

<div class="overlay" id="overlay"></div>

<main class="shell">
  <aside class="filters" id="filters" aria-label="Filters"></aside>

  <section>
    <div id="hero" class="hero">
      <h1>Find your next <span class="grad">Modrinth</span> mod</h1>
      <p>Search, filter, save and inspect mods — powered by the Modrinth API.</p>
    </div>
    <div class="toolbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn filter-toggle" id="filterToggle"><span id="filterIcon"></span>Filters</button>
        <div class="count" id="count"></div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <label class="sortwrap"><span>Sort by</span><select class="field" id="sort"></select></label>
        <div class="seg" id="viewSeg" data-v="grid">
          <span class="slide"></span>
          <button data-view="grid" aria-label="Grid view" aria-pressed="true"><span id="gridIcon"></span></button>
          <button data-view="list" aria-label="List view" aria-pressed="false"><span id="listIcon"></span></button>
        </div>
      </div>
    </div>
    <div class="grid" id="grid" aria-live="polite"></div>
    <div class="more"><button class="btn" id="loadMore" hidden>Load more</button></div>
    <div id="sentinel"></div>
  </section>
</main>

<aside class="drawer" id="drawer" aria-label="Mod details">
  <div class="drawer-head">
    <strong>Mod details</strong>
    <button class="icon-btn" id="closeDrawer" aria-label="Close"></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="modal-wrap" id="settingsModal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="modal-head">
      <h2 id="setTitle">Settings</h2>
      <button class="icon-btn" id="closeSettings" aria-label="Close settings"></button>
    </div>
    <div class="modal-body" id="setBody"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ---------- constants ---------- */
const API = 'https://api.modrinth.com/v2';
const SITE = 'https://modrinth.com';
const LOADERS = ['fabric','forge','neoforge','quilt'];
const CATEGORIES = ['adventure','decoration','equipment','food','game-mechanics','library','magic','management','mobs','optimization','storage','technology','transportation','utility','worldgen'];
const SORTS = [['relevance','Relevance'],['downloads','Downloads'],['follows','Follows'],['updated','Recently updated'],['newest','Newest']];
const ACCENTS = {indigo:'#818cf8', emerald:'#34d399', rose:'#fb7185', amber:'#fbbf24', sky:'#38bdf8'};
const THEMES = [
  {id:'night',  name:'Night',  bg:'#0b0d12', c:'#818cf8'},
  {id:'aurora', name:'Aurora', bg:'#061619', c:'#2dd4bf'},
  {id:'ember',  name:'Ember',  bg:'#130b09', c:'#fb923c'},
  {id:'paper',  name:'Paper',  bg:'#f5f4f0', c:'#4f46e5'},
  {id:'mint',   name:'Mint',   bg:'#eef8f3', c:'#059669'}
];
const DEFAULTS = {theme:'night', accent:'indigo', density:'comfortable', motion:!matchMedia('(prefers-reduced-motion: reduce)').matches, infinite:true, pageSize:20, view:'grid'};

/* ---------- icons (hand-drawn SVG paths, stroke-based) ---------- */
const ICONS = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  heart:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 12 6a5.5 5.5 0 0 0-10 2.5c0 2.3 1.5 4 3 5.5L12 21z"/>',
  download:'<path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  external:'<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  close:'<path d="M18 6 6 18M6 6l12 12"/>',
  filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',
  sparkle:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  palette:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.3"/><circle cx="12" cy="7.5" r="1.3"/><circle cx="16" cy="10" r="1.3"/><path d="M12 21a2 2 0 0 1 0-4h2a2 2 0 0 0 2-2"/>',
  reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  code:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 4l-4 16"/>',
  bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5h.01"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>'
};
const ic = (n, cls='') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const compact = n => new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n||0);
const dateFmt = d => d ? new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) : '';
const letter = t => (String(t||'?').trim()[0] || '?').toUpperCase();

function store(key, fallback){ try{ return JSON.parse(localStorage.getItem(key)) ?? fallback }catch{ return fallback } }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)) }catch{} }

/* ---------- state ---------- */
let settings = {...DEFAULTS, ...store('lumen-settings', {})};
let saved = store('lumen-saved', []);             // array of search hits
const known = new Map();                          // project_id -> hit (for lookups)
const state = {
  tab:'explore', query:'', sort:'relevance',
  loaders:new Set(), categories:new Set(), gameVersion:'',
  offset:0, total:0, hits:[], loading:false
};
let controller = null;
let debounceTimer = null;

/* ---------- settings apply ---------- */
function applySettings(){
  const root = document.documentElement;
  root.dataset.theme = settings.theme;
  root.dataset.density = settings.density;
  root.dataset.motion = settings.motion ? 'on' : 'off';
  root.style.setProperty('--accent', ACCENTS[settings.accent] || ACCENTS.indigo);
  $('#viewSeg').dataset.v = settings.view;
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === settings.view));
  $('#grid').classList.toggle('list', settings.view === 'list');
  save('lumen-settings', settings);
}

/* ---------- static UI bits ---------- */
function paintIcons(){
  $('#searchIcon').innerHTML = ic('search');
  $('#settingsIcon').innerHTML = ic('gear');
  $('#gridIcon').innerHTML = ic('grid');
  $('#listIcon').innerHTML = ic('list');
  $('#filterIcon').innerHTML = ic('filter');
  $('#closeDrawer').innerHTML = ic('close');
  $('#closeSettings').innerHTML = ic('close');
}

function buildSort(){
  $('#sort').innerHTML = SORTS.map(([v,l]) => `<option value="${v}">${l}</option>`).join('');
}

function buildFilters(){
  $('#filters').innerHTML = `
    <h4>Loader</h4>
    <div class="chips" id="loaderChips">${LOADERS.map(l => chip('loader', l)).join('')}</div>
    <h4>Categories</h4>
    <div class="chips" id="catChips">${CATEGORIES.map(c => chip('cat', c)).join('')}</div>
    <h4>Minecraft version</h4>
    <select class="field" id="gameVersion"><option value="">Any version</option></select>
    <button class="ghost" id="resetFilters">${ic('reset')} Reset filters</button>`;
  $('#resetFilters').innerHTML = `${ic('reset')} Reset filters`;
}
const chip = (kind, v) => `<button class="chip" data-kind="${kind}" data-v="${v}" aria-pressed="false">${v}</button>`;

async function loadGameVersions(){
  try{
    const res = await fetch(`${API}/tag/game_version`);
    const list = await res.json();
    const releases = list.filter(v => v.version_type === 'release').slice(0, 60);
    $('#gameVersion').insertAdjacentHTML('beforeend', releases.map(v => `<option value="${esc(v.version)}">${esc(v.version)}</option>`).join(''));
  }catch{ toast('Could not load Minecraft versions', 'error'); }
}

/* ---------- search ---------- */
async function runSearch(reset = false){
  if(state.tab !== 'explore') return;
  if(reset){ state.offset = 0; state.hits = []; state.total = 0; }
  if(controller) controller.abort();
  const ctl = controller = new AbortController();

  const facets = [['project_type:mod']];
  if(state.loaders.size) facets.push([...state.loaders].map(l => `categories:${l}`));
  for(const c of state.categories) facets.push([`categories:${c}`]);
  if(state.gameVersion) facets.push([`versions:${state.gameVersion}`]);

  const params = new URLSearchParams({
    query: state.query, index: state.sort, limit: settings.pageSize,
    offset: state.offset, facets: JSON.stringify(facets)
  });

  state.loading = true; updateMore();
  const startIdx = state.hits.length;
  if(reset) renderSkeletons(settings.pageSize > 12 ? 12 : settings.pageSize);
  else showLoadingRow(true);

  try{
    const res = await fetch(`${API}/search?${params}`, {signal: ctl.signal});
    if(!res.ok) throw new Error(`Modrinth returned ${res.status}`);
    const data = await res.json();
    state.total = data.total_hits;
    state.hits.push(...data.hits);
    state.offset += data.hits.length;
    data.hits.forEach(h => known.set(h.project_id, h));
    renderResults(startIdx, reset);
  }catch(err){
    if(err.name === 'AbortError') return;
    toast(err.message || 'Search failed', 'error');
    if(reset) $('#grid').innerHTML = emptyHTML('alert', 'Could not reach Modrinth', 'Check your connection and try again.');
  }finally{
    if(ctl === controller){ state.loading = false; showLoadingRow(false); updateMore(); }
  }
}

function renderResults(startIdx, reset){
  const grid = $('#grid');
  if(reset) grid.innerHTML = '';
  $('#count').innerHTML = `<b>${state.total.toLocaleString()}</b> mods${state.query ? ` for “${esc(state.query)}”` : ''}`;
  if(!state.hits.length){
    grid.innerHTML = emptyHTML('search', 'No mods found', 'Try a different search or clear some filters.');
    return;
  }
  const frag = document.createDocumentFragment();
  state.hits.slice(startIdx).forEach((h, i) => {
    const t = document.createElement('div');
    t.innerHTML = cardHTML(h, i);
    frag.append(t.firstElementChild);
  });
  grid.append(frag);
}

function renderSaved(){
  const grid = $('#grid');
  $('#count').innerHTML = `<b>${saved.length}</b> saved mod${saved.length === 1 ? '' : 's'}`;
  if(!saved.length){
    grid.innerHTML = emptyHTML('bookmark', 'Nothing saved yet', 'Tap the heart on any mod to keep it here.');
  }else{
    grid.innerHTML = saved.map((h, i) => cardHTML(h, i)).join('');
  }
  updateMore();
}

function emptyHTML(icon, title, sub){
  return `<div class="empty">${ic(icon)}<h3>${esc(title)}</h3><div>${esc(sub)}</div></div>`;
}

function renderSkeletons(n){
  $('#grid').innerHTML = Array.from({length:n}, () => `
    <div class="skel" aria-hidden="true">
      <div style="display:flex;gap:12px"><div class="sk" style="width:52px;height:52px;border-radius:14px"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px;padding-top:4px"><div class="sk" style="height:14px;width:70%"></div><div class="sk" style="height:10px;width:45%"></div></div></div>
      <div class="sk" style="height:10px;width:95%"></div><div class="sk" style="height:10px;width:80%"></div>
      <div class="sk" style="height:10px;width:35%;margin-top:auto"></div>
    </div>`).join('');
}

function showLoadingRow(on){
  let row = $('#loadingRow');
  if(on && !row){
    row = document.createElement('div');
    row.id = 'loadingRow';
    row.className = 'empty';
    row.style.padding = '18px';
    row.innerHTML = '<div class="spinner" style="margin:0 auto"></div>';
    $('#grid').after(row);
  }else if(!on && row){ row.remove(); }
}

function updateMore(){
  const btn = $('#loadMore');
  const more = state.tab === 'explore' && state.hits.length < state.total;
  btn.hidden = !(more && !settings.infinite);
  btn.disabled = state.loading;
  btn.textContent = state.loading ? 'Loading…' : 'Load more';
}

function maybeInfinite(){
  if(settings.infinite && state.tab === 'explore' && !state.loading && state.hits.length && state.hits.length < state.total){
    runSearch(false);
  }
}

/* ---------- cards ---------- */
function cardHTML(h, i = 0){
  const isSaved = saved.some(s => s.project_id === h.project_id);
  const cats = (h.categories || []).slice(0, 3);
  const icon = h.icon_url
    ? `<div class="icon" aria-hidden="true">${letter(h.title)}<img src="${esc(h.icon_url)}" alt="" loading="lazy" referrerpolicy="no-referrer"></div>`
    : `<div class="icon" aria-hidden="true">${letter(h.title)}</div>`;
  return `
  <article class="card" tabindex="0" role="button" data-id="${esc(h.project_id)}" style="animation-delay:${Math.min(i*35,450)}ms" aria-label="${esc(h.title)}">
    <div class="card-top">
      ${icon}
      <div class="meta"><h3>${esc(h.title)}</h3><p class="by">by ${esc(h.author)}</p></div>
      <button class="icon-btn save ${isSaved ? 'on' : ''}" data-save aria-label="${isSaved ? 'Remove from saved' : 'Save mod'}" aria-pressed="${isSaved}">${ic('heart')}</button>
    </div>
    <p class="desc">${esc(h.description)}</p>
    <div class="tags">${cats.map(c => `<span class="tag">${esc(c)}</span>`).join('')}</div>
    <div class="stats"><span>${ic('download')}${compact(h.downloads)}</span><span>${ic('heart')}${compact(h.follows)}</span></div>
  </article>`;
}

/* ---------- saved ---------- */
function toggleSaved(hit){
  const idx = saved.findIndex(s => s.project_id === hit.project_id);
  if(idx >= 0){ saved.splice(idx, 1); toast(`Removed ${hit.title}`); }
  else{
    saved.unshift({
      project_id:hit.project_id, slug:hit.slug, title:hit.title, description:hit.description,
      icon_url:hit.icon_url, author:hit.author, downloads:hit.downloads, follows:hit.follows,
      categories:hit.categories || [], date_modified:hit.date_modified
    });
    toast(`Saved ${hit.title}`, 'ok');
  }
  save('lumen-saved', saved);
  updateSavedBadge();
  if(state.tab === 'saved') renderSaved();
  else refreshSaveButtons();
}
function refreshSaveButtons(){
  document.querySelectorAll('#grid .card').forEach(card => {
    const on = saved.some(s => s.project_id === card.dataset.id);
    const btn = card.querySelector('[data-save]');
    if(btn){ btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on); }
  });
}
function updateSavedBadge(){
  $('#savedCount').innerHTML = saved.length ? `<span class="badge show" style="position:static;display:inline-grid;margin-left:4px;transform:none">${saved.length}</span>` : '';
}

/* ---------- drawer ---------- */
async function openDetail(id){
  const hit = known.get(id) || saved.find(s => s.project_id === id);
  if(!hit) return;
  const body = $('#drawerBody');
  const drawer = $('#drawer'), overlay = $('#overlay');
  drawer.classList.add('open'); overlay.classList.add('open');
  const isSaved = saved.some(s => s.project_id === id);
  body.innerHTML = `
    <div class="d-top">
      <div class="icon lg" aria-hidden="true">${letter(hit.title)}${hit.icon_url ? `<img src="${esc(hit.icon_url)}" alt="">` : ''}</div>
      <div><h2>${esc(hit.title)}</h2><p>by ${esc(hit.author)}</p></div>
    </div>
    <p class="d-desc">${esc(hit.description)}</p>
    <div class="d-actions">
      <button class="btn primary" id="dSave">${ic('heart')}<span>${isSaved ? 'Saved' : 'Save mod'}</span></button>
      <a class="btn" href="${SITE}/mod/${esc(hit.slug || id)}" target="_blank" rel="noopener">${ic('external')}Open on Modrinth</a>
    </div>
    <div class="d-stats">
      <div class="d-stat"><small>Downloads</small><div>${compact(hit.downloads)}</div></div>
      <div class="d-stat"><small>Follows</small><div>${compact(hit.follows)}</div></div>
      <div class="d-stat"><small>Updated</small><div style="font-size:14px">${dateFmt(hit.date_modified)}</div></div>
    </div>
    <div id="dExtra"><div class="sk" style="height:120px;border-radius:14px;margin-top:8px"></div></div>`;
  $('#dSave').onclick = () => {
    toggleSaved(hit);
    const on = saved.some(s => s.project_id === id);
    $('#dSave').querySelector('span').textContent = on ? 'Saved' : 'Save mod';
  };

  try{
    const [project, versions] = await Promise.all([
      fetch(`${API}/project/${id}`).then(r => { if(!r.ok) throw new Error(); return r.json() }),
      fetch(`${API}/project/${id}/version`).then(r => r.ok ? r.json() : []).catch(() => [])
    ]);
    if(!$('#dExtra')) return;
    const links = [
      project.source_url && ['Source', project.source_url],
      project.issues_url && ['Issues', project.issues_url],
      project.wiki_url && ['Wiki', project.wiki_url],
      project.discord_url && ['Discord', project.discord_url]
    ].filter(Boolean);
    const gallery = (project.gallery || []).slice(0, 6);
    $('#dExtra').innerHTML = `
      ${links.length ? `<div class="section-title">Links</div><div class="links">${links.map(([l,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${ic('external')}${esc(l)}</a>`).join('')}</div>` : ''}
      ${gallery.length ? `<div class="section-title">Gallery</div><div class="gallery">${gallery.map(g => `<img src="${esc(g.url)}" alt="${esc(g.title || hit.title)}" loading="lazy">`).join('')}</div>` : ''}
      <div class="section-title">Recent versions</div>
      <div class="versions">${versions.slice(0, 6).map((v, i) => {
        const f = (v.files || []).find(x => x.primary) || v.files?.[0];
        return `<div class="ver" style="animation-delay:${i*60}ms">
          <div><div class="vn">${esc(v.version_number)}</div>
          <div class="vm">${esc((v.game_versions||[]).slice(0,3).join(', '))}${(v.game_versions||[]).length>3?'…':''} · ${esc((v.loaders||[]).join(', '))} · ${dateFmt(v.date_published)}</div></div>
          ${f ? `<a class="dl" href="${esc(f.url)}" target="_blank" rel="noopener">${ic('download')}Get</a>` : ''}
        </div>`;
      }).join('') || '<div class="vm" style="color:var(--muted)">No versions found.</div>'}</div>
      ${project.body ? `<div class="section-title">About</div><div class="md-box"><div class="md">${md(project.body)}</div></div>` : ''}
    `;
  }catch{
    if($('#dExtra')) $('#dExtra').innerHTML = `<p style="color:var(--muted)">Couldn’t load full details right now.</p>`;
  }
}
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#overlay').classList.remove('open'); }

/* minimal, safe markdown: escapes HTML first, then formats */
function md(src=''){
  const inline = s => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let html = '', inList = false;
  for(const raw of src.split('\n').slice(0, 400)){
    const l = esc(raw);
    if(/^\s*[-*] /.test(raw)){
      if(!inList){ html += '<ul>'; inList = true; }
      html += `<li>${inline(l.replace(/^\s*[-*] /, ''))}</li>`; continue;
    }
    if(inList){ html += '</ul>'; inList = false; }
    if(/^#{1,3} /.test(raw)){
      const n = raw.match(/^#+/)[0].length + 2;
      html += `<h${n}>${inline(l.replace(/^#+ /, ''))}</h${n}>`; continue;
    }
    if(raw.trim()) html += `<p>${inline(l)}</p>`;
  }
  if(inList) html += '</ul>';
  return html;
}

/* ---------- settings modal ---------- */
function openSettings(){
  renderSettings();
  $('#settingsModal').classList.add('open');
  $('#settingsModal').setAttribute('aria-hidden','false');
}
function closeSettings(){
  $('#settingsModal').classList.remove('open');
  $('#settingsModal').setAttribute('aria-hidden','true');
}
function renderSettings(){
  $('#setBody').innerHTML = `
    <div class="set-row" style="display:block">
      <h4>${ic('palette')} Theme</h4><p>Pick a base look for the whole interface.</p>
      <div class="themes">${THEMES.map(t => `
        <button class="theme-card" data-theme-pick="${t.id}" aria-pressed="${settings.theme===t.id}" style="--c:${t.c}">
          <div class="theme-prev" style="background:${t.bg}"><i></i></div>
          <span>${t.name}</span>
        </button>`).join('')}</div>
    </div>
    <div class="set-row" style="display:block">
      <h4>Accent color</h4><p>Used for highlights, buttons and glows.</p>
      <div class="swatches">${Object.entries(ACCENTS).map(([k,c]) => `
        <button class="sw" data-accent="${k}" aria-label="${k}" aria-pressed="${settings.accent===k}" style="--c:${c}"></button>`).join('')}</div>
    </div>
    <div class="set-row">
      <div><h4>Density</h4><p>How tightly cards are packed.</p></div>
      <div class="seg2">
        <button data-density-pick="comfortable" aria-pressed="${settings.density==='comfortable'}">Comfortable</button>
        <button data-density-pick="compact" aria-pressed="${settings.density==='compact'}">Compact</button>
      </div>
    </div>
    <div class="set-row">
      <div><h4>Results per load</h4><p>How many mods to fetch at a time.</p></div>
      <select class="field" id="pageSize" style="width:110px;height:36px">
        ${[12,20,40,60].map(n => `<option value="${n}" ${settings.pageSize===n?'selected':''}>${n}</option>`).join('')}
      </select>
    </div>
    <div class="set-row">
      <div><h4>Infinite scroll</h4><p>Load more automatically; off shows a button.</p></div>
      <button class="switch" role="switch" data-switch="infinite" aria-checked="${settings.infinite}" aria-label="Infinite scroll"></button>
    </div>
    <div class="set-row">
      <div><h4>Animations</h4><p>Motion and transitions across the interface.</p></div>
      <button class="switch" role="switch" data-switch="motion" aria-checked="${settings.motion}" aria-label="Animations"></button>
    </div>
    <div class="set-row">
      <div><h4>Default view</h4><p>Grid or list when you open the page.</p></div>
      <div class="seg2">
        <button data-view-pick="grid" aria-pressed="${settings.view==='grid'}">Grid</button>
        <button data-view-pick="list" aria-pressed="${settings.view==='list'}">List</button>
      </div>
    </div>
    <div class="set-row">
      <div><h4>Your data</h4><p>${saved.length} saved mod${saved.length===1?'':'s'} stored in this browser.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn" id="exportSaved">${ic('download')}Export</button>
        <button class="btn danger" id="clearSaved">Clear</button>
      </div>
    </div>
    <div class="set-row">
      <div><h4>Reset settings</h4><p>Restore the default theme and preferences.</p></div>
      <button class="btn" id="resetSettings">${ic('reset')}Reset</button>
    </div>`;
}

function bindSettingsEvents(e){
  const t = e.target.closest('button, select');
  if(!t) return;
  if(t.dataset.themePick){ settings.theme = t.dataset.themePick; }
  else if(t.dataset.accent){ settings.accent = t.dataset.accent; }
  else if(t.dataset.densityPick){ settings.density = t.dataset.densityPick; }
  else if(t.dataset.viewPick){ settings.view = t.dataset.viewPick; }
  else if(t.dataset.switch){ settings[t.dataset.switch] = !settings[t.dataset.switch]; }
  else if(t.id === 'exportSaved') return exportSaved();
  else if(t.id === 'clearSaved'){
    if(!saved.length) return toast('Nothing to clear');
    if(!confirm('Remove all saved mods?')) return;
    saved = []; save('lumen-saved', saved); updateSavedBadge(); if(state.tab==='saved') renderSaved(); toast('Saved list cleared');
  }
  else if(t.id === 'resetSettings'){
    settings = {...DEFAULTS}; toast('Settings reset', 'ok');
  }
  else return;
  applySettings(); renderSettings();
  if(t.dataset.view) return;
}
function bindSettingsSelect(e){
  if(e.target.id === 'pageSize'){ settings.pageSize = Number(e.target.value); applySettings(); }
}

function exportSaved(){
  const blob = new Blob([JSON.stringify(saved, null, 2)], {type:'application/json'});
  const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(blob), download: 'lumen-saved-mods.json'});
  document.body.append(a); a.click(); a.remove();
  toast('Exported saved mods', 'ok');
}

/* ---------- toasts ---------- */
function toast(msg, type=''){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('#toasts').append(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('in')));
  setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 350); }, 2600);
}

/* ---------- tabs & view ---------- */
function setTab(tab){
  state.tab = tab;
  const tabs = $('#tabs');
  tabs.dataset.active = tab;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('#hero').hidden = tab === 'saved';
  if(tab === 'saved'){ renderSaved(); }
  else { runSearch(true); }
}

/* ---------- events ---------- */
function bind(){
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if(b && b.dataset.tab !== state.tab) setTab(b.dataset.tab); });

  $('#q').addEventListener('input', e => {
    state.query = e.target.value.trim();
    if(state.tab !== 'explore') { state.tab = 'explore'; setTab('explore'); return; }
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => runSearch(true), 280);
  });

  $('#sort').addEventListener('change', e => { state.sort = e.target.value; runSearch(true); });

  $('#filters').addEventListener('click', e => {
    const chipEl = e.target.closest('.chip');
    if(chipEl){
      const set = chipEl.dataset.kind === 'loader' ? state.loaders : state.categories;
      const v = chipEl.dataset.v;
      set.has(v) ? set.delete(v) : set.add(v);
      chipEl.setAttribute('aria-pressed', set.has(v));
      if(state.tab !== 'explore') setTab('explore'); else runSearch(true);
    }
    if(e.target.closest('#resetFilters')){
      state.loaders.clear(); state.categories.clear(); state.gameVersion = '';
      document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
      $('#gameVersion').value = '';
      runSearch(true);
    }
  });
  $('#filters').addEventListener('change', e => {
    if(e.target.id === 'gameVersion'){ state.gameVersion = e.target.value; runSearch(true); }
  });

  $('#viewSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-view]'); if(!b) return;
    settings.view = b.dataset.view; applySettings();
  });

  $('#filterToggle').addEventListener('click', () => $('#filters').classList.toggle('collapsed'));

  $('#grid').addEventListener('click', e => {
    const card = e.target.closest('.card'); if(!card) return;
    const hit = known.get(card.dataset.id) || saved.find(s => s.project_id === card.dataset.id);
    if(e.target.closest('[data-save]')){ e.stopPropagation(); if(hit) toggleSaved(hit); return; }
    openDetail(card.dataset.id);
  });
  $('#grid').addEventListener('keydown', e => {
    if((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')){ e.preventDefault(); openDetail(e.target.dataset.id); }
  });

  $('#loadMore').addEventListener('click', () => runSearch(false));
  $('#closeDrawer').addEventListener('click', closeDrawer);
  $('#overlay').addEventListener('click', () => { closeDrawer(); closeSettings(); });

  $('#openSettings').addEventListener('click', openSettings);
  $('#closeSettings').addEventListener('click', closeSettings);
  $('#settingsModal').addEventListener('click', e => { if(e.target.id === 'settingsModal') closeSettings(); });
  $('#setBody').addEventListener('click', e => {
    bindSettingsEvents(e);
  });
  $('#setBody').addEventListener('change', bindSettingsSelect);

  document.addEventListener('keydown', e => {
    if(e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); $('#q').focus(); }
    if(e.key === 'Escape'){ closeDrawer(); closeSettings(); }
  });

  const io = new IntersectionObserver(entries => { if(entries.some(en => en.isIntersecting)) maybeInfinite(); }, {rootMargin:'400px'});
  io.observe($('#sentinel'));
}

/* ---------- boot ---------- */
function boot(){
  paintIcons();
  buildSort();
  buildFilters();
  applySettings();
  updateSavedBadge();
  bind();
  loadGameVersions();
  setTab('explore');
  const tabs = $('#tabs');
  tabs.querySelector('.tab-pill')?.setAttribute('aria-hidden','true');
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
